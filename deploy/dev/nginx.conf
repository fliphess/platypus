# Local stand-in for the gateway and oauth2-proxy: every hostname is one
# logged-in test user. Browsers resolve *.localhost to this machine, and each
# hostname keeps its own cookies, so you can be three users at once.
#
# Like the real gateway, it drops any identity header the browser sends and
# sets its own. Platypus has no login code for this: it reads the same header
# as in production.

map $host $platypus_user {
    admin.localhost  admin@example.com;
    editor.localhost editor@example.com;
    nobody.localhost nobody@example.com;
    default          "";
}

# The groups the login proxy would report: the editor is in the payments
# group, so group-linked teams can be tried and tested.
map $host $platypus_groups {
    editor.localhost "payments";
    default          "";
}

server {
    listen 8090;

    # While platypus restarts, show a page that says so instead of nginx's
    # default 502. Intercept only connection-level errors: the app answers
    # its own failures with its own page.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        root /usr/share/nginx/html;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email $platypus_user;
        proxy_set_header X-Auth-Request-Groups $platypus_groups;
    }
}
