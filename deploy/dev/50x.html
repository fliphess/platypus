<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platypus is restarting</title>
  <style>
    /* Served by the dev proxy itself, while platypus is down: self-contained
       so it needs no stylesheet from the app. */
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: #f6f7f9; color: #1d2430; }
    main { max-width: 34rem; margin: 4rem auto; padding: 0 1.25rem; text-align: center; }
    img { width: 96px; height: auto; }
    h1 { font-size: 1.35rem; margin: 1rem 0 0.5rem; }
    p { color: #5d6878; line-height: 1.6; margin: 0.4rem 0; }
    a { color: #0f766e; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c2129; color: #e3e7ed; }
      p { color: #a3adbb; }
      a { color: #3cc0b0; }
    }
  </style>
</head>
<body>
  <main>
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 60'%3E%3Crect width='120' height='60' rx='30' fill='%232f6f4f'/%3E%3C/svg%3E" alt="">
    <h1>Platypus is restarting</h1>
    <p>The service is starting up or briefly unavailable — this usually takes a few seconds.</p>
    <p>Reload the page in a moment. Nothing you saved has been lost.</p>
  </main>
</body>
</html>
