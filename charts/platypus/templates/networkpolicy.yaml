{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if and (not $np.ingressFrom) (not $np.gatewayNamespace) }}
{{- fail "networkPolicy needs gatewayNamespace or ingressFrom: who may reach platypus?" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platypus.fullname" . }}-web
  labels:
    {{- include "platypus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platypus.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- if $np.ingressFrom }}
        {{- toYaml $np.ingressFrom | nindent 8 }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.gatewayNamespace }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    {{- include "platypus.egressRules" $np | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platypus.fullname" . }}-worker
  labels:
    {{- include "platypus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platypus.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "platypus.egressRules" $np | nindent 4 }}
{{- end }}

{{- define "platypus.egressRules" }}
- to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .dnsNamespace }}
  ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
- ports:
    - port: {{ .postgresPort }}
      protocol: TCP
  {{- with .postgresTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
- ports:
    - port: 443
      protocol: TCP
  {{- with .httpsTo }}
  to:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .podIdentity }}
# EKS Pod Identity: credentials come from the link-local agent, not HTTPS.
- to:
    - ipBlock:
        cidr: 169.254.170.23/32
  ports:
    - port: 80
      protocol: TCP
{{- end }}
{{- end }}
