{{- if and .Values.secret.create (not .Values.secret.existingSecret) (not .Values.externalSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platypus.fullname" . }}
  labels:
    {{- include "platypus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- else if and (not .Values.secret.existingSecret) (not .Values.externalSecret.enabled) }}
{{- fail "Provide the secret settings: set secret.existingSecret, secret.create or externalSecret.enabled" }}
{{- end }}
