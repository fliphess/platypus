{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "platypus.fullname" . }}
  labels:
    {{- include "platypus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "platypus.secretName" . }}
    creationPolicy: Owner
  data:
    {{- required "externalSecret.data is required" .Values.externalSecret.data | toYaml | nindent 4 }}
{{- end }}
