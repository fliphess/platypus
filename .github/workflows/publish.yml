# Publishes the moving "latest" builds on every merge to main: the container
# image and the Helm chart. Fixed versions come from release.yml, on a tag.
name: Publish

on:
  push:
    branches: [main]

# ci.yml tests every push to main; publishing reads the code and writes packages.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version stamp
        run: echo "VERSION=dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fliphess/platypus:latest
          build-args: VERSION=${{ env.VERSION }}
          provenance: true
          sbom: true

  chart:
    name: Chart (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push
        run: |
          version="$(sed -n 's/^version: //p' charts/platypus/Chart.yaml)"
          dev="${version}-dev.${GITHUB_SHA::7}"
          helm package charts/platypus --version "$dev" --app-version latest --destination .
          helm push "platypus-${dev}.tgz" oci://ghcr.io/fliphess/charts
          docker buildx imagetools create \
            -t ghcr.io/fliphess/charts/platypus:latest \
            ghcr.io/fliphess/charts/platypus:"$dev"
