# Publishes the moving "latest" builds after CI for that commit passed on
# main: the container image and the Helm chart. Fixed versions come from
# release.yml, on a tag.
name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  image:
    name: Image (latest)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version stamp
        run: echo "VERSION=dev.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/fliphess/platypus:latest
          build-args: VERSION=${{ env.VERSION }}
          provenance: true
          sbom: true

  chart:
    name: Chart (latest)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push
        run: |
          version="$(sed -n 's/^version: //p' charts/platypus/Chart.yaml)"
          dev="${version}-dev.$(git rev-parse --short HEAD)"
          helm package charts/platypus --version "$dev" --app-version latest --destination .
          helm push "platypus-${dev}.tgz" oci://ghcr.io/fliphess/charts
          docker buildx imagetools create \
            -t ghcr.io/fliphess/charts/platypus:latest \
            ghcr.io/fliphess/charts/platypus:"$dev"
