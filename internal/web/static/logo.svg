<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" role="img" aria-label="Platypus">
  <title>Platypus</title>
  <!-- tail -->
  <ellipse cx="10" cy="23" rx="9" ry="5.5" fill="#6f4a2f" transform="rotate(-8 10 23)"/>
  <!-- body and belly -->
  <ellipse cx="29" cy="22" rx="16" ry="10" fill="#8b5e3c"/>
  <ellipse cx="30" cy="26.5" rx="11.5" ry="4.5" fill="#a97b55" opacity="0.7"/>
  <!-- head -->
  <circle cx="43" cy="19" r="7.5" fill="#8b5e3c"/>
  <!-- bill -->
  <rect x="47" y="15.5" width="15.5" height="7" rx="3.5" fill="#3f4a5a"/>
  <circle cx="58.5" cy="18" r="0.7" fill="#2a313c"/>
  <!-- eye -->
  <circle cx="44.5" cy="16.5" r="1.4" fill="#1b1b1b"/>
  <circle cx="45" cy="16" r="0.45" fill="#ffffff"/>
  <!-- webbed feet -->
  <path d="M35 30.5 l-2 4.5 h3 l1-2 1 2 h3 l-2-4.5 z" fill="#3f4a5a"/>
  <path d="M20 30 l-2 4.5 h3 l1-2 1 2 h3 l-2-4.5 z" fill="#3f4a5a"/>
</svg>
